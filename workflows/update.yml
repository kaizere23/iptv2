name: Auto Update KBS World M3U

on:
  schedule:
    - cron: '0 */6 * * *'  # Jalan setiap 6 jam
  workflow_dispatch:        # Pilihan untuk jalankan secara manual dari GitHub

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Extraction Script
        run: python update_kbs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update KBS World stream URL" && git push)

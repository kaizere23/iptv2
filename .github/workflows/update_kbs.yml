name: Auto Update KBS M3U8 Link

on:
  schedule:
    # Dijalankan secara automatik setiap 1 jam sekali
    - cron: '0 * * * *'
  workflow_dispatch: # Membenarkan punang "Run workflow" dipicit secara manual di GitHub

jobs:
  update-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper Script
        run: |
          python get_kbs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kbs_world.m3u8
          
          # Hanya commit jika ada perubahan pada kandungan fail
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Update KBS M3U8 signed link" && git push)

name: Auto Update KBS M3U8 Link (Playwright)

on:
  schedule:
    # Dijalankan secara automatik setiap 1 jam sekali
    - cron: '0 * * * *'
  workflow_dispatch: # Membenarkan anda tekan "Run workflow" secara manual

permissions:
  contents: write

jobs:
  update-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Playwright Scraper
        run: |
          python get_kbs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          touch kbs_world.m3u8
          git add kbs_world.m3u8
          
          git diff --staged --quiet || (git commit -m "Chore: Auto-update fresh KBS signed URL" && git push)

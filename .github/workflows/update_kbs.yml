name: Auto Update KBS M3U8 Link

on:
  schedule:
    - cron: '0 * * * *'  # Berjalan setiap 1 jam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run API Fetcher
        run: |
          python get_kbs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          touch kbs_world.m3u8
          git add kbs_world.m3u8
          
          git diff --staged --quiet || (git commit -m "Chore: Auto-update fresh KBS signed URL" && git push)

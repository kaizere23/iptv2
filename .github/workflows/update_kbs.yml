name: Auto Update KBS M3U8 Link

on:
  schedule:
    - cron: '0 */6 * * *' # Boleh diset setiap 6 jam
  workflow_dispatch:

jobs:
  update-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper Script
        run: |
          python get_kbs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pastikan fail wujud sebelum git add
          touch kbs_world.m3u8
          git add kbs_world.m3u8
          
          # Commit hanya jika ada perubahan
          git diff --staged --quiet || (git commit -m "Update KBS M3U8 link" && git push)
